<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锦江十二月市 · 白模流程蓝图</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --line: #2c313b; --text: #e6e8ec; --mute: #8b93a1;
    --U: #4fd1c5; --A: #f6a04d; --B: #6aa8ff; --hot: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  button { font: inherit; color: inherit; background: #262a33; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: #4a5160; }
  button.on { background: #e6e8ec; color: #15171c; border-color: #e6e8ec; }
  .app { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr) 420px; height: 100vh; }

  /* 顶部流程条 */
  header { grid-column: 1 / 3; border-bottom: 1px solid var(--line); padding: 8px 14px 10px; }
  .title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .title b { font-size: 15px; }
  .title span { color: var(--mute); }
  .flow { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
  .flow .node { white-space: nowrap; padding: 5px 10px; border-radius: 16px; border: 1px solid var(--line); background: #20242c; cursor: pointer; }
  .flow .node.g-转场 { border-style: dashed; color: #c9cdd6; }
  .flow .node.g-六关 { background: #27303a; }
  .flow .node.on { background: var(--hot); color: #111; border-color: var(--hot); }
  .flow .arr { color: #4a5160; }
  .flow .node small { color: var(--mute); margin-left: 4px; }
  .flow .node.on small { color: #333; }

  /* 舞台 */
  .stage-wrap { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .toolbar .grp { display: flex; gap: 4px; align-items: center; }
  .toolbar .grp > span { color: var(--mute); margin-right: 2px; }
  .stage { position: relative; display: flex; gap: 18px; align-items: center; justify-content: center; padding: 14px; min-height: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #232731, #15171c 70%); }
  .vp-slot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .vp-cap { color: var(--mute); font-size: 12px; }
  .vp-box { position: relative; }
  .frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000;
    border-radius: 18px; box-shadow: 0 0 0 8px #0b0c0f, 0 0 0 9px #333a46, 0 20px 50px rgba(0,0,0,.5); }
  .frame.big { border-radius: 4px; box-shadow: 0 0 0 10px #0b0c0f, 0 0 0 11px #333a46, 0 20px 50px rgba(0,0,0,.5); }
  .frame canvas { display: block; position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; }
  .labels { pointer-events: none; z-index: 1; }
  .video { z-index: 2; }
  .ui { pointer-events: none; z-index: 3; }
  .ui .uib { pointer-events: auto; }
  .video { display: none; }

  /* 3D 标注 */
  .lbl { font-size: 11px; line-height: 1.25; padding: 2px 6px; border-radius: 4px; background: rgba(15,17,22,.82); color: #fff;
    border-left: 3px solid var(--c); white-space: nowrap; transform: translateY(-6px); pointer-events: auto; cursor: pointer; }
  .lbl i { font-style: normal; color: #aab; display: block; font-size: 10px; }
  .lbl.zone { background: rgba(15,17,22,.6); }
  .lbl.you { background: var(--hot); color: #111; border: 0; font-weight: 700; }
  .lbl.text3d { background: none; border: 0; font-size: 22px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .hide-3dlbl .lbl:not(.you):not(.text3d) { display: none; }
  .hide-size .lbl i { display: none; }

  /* UI 盒子（坐标即设备像素） */
  .uib { position: absolute; border: 2px dashed var(--c); border-radius: 10px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 16px; text-align: center; background: rgba(20,22,28,.55); cursor: pointer; }
  .uib .tag { position: absolute; left: -2px; top: -20px; font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 4px; background: var(--c); color: #111; white-space: nowrap; }
  .hide-uilbl .uib .tag { display: none; }
  .hide-uilbl .uib { border-color: transparent; }
  .uib.bar { background: rgba(250,244,230,.92); color: #3b2a1a; border-radius: 22px; }
  .uib.chip { background: rgba(250,244,230,.85); color: #3b2a1a; font-size: 14px; border-radius: 15px; }
  .uib.round { border-radius: 50%; background: rgba(250,244,230,.5); color: #3b2a1a; }
  .uib.zone { background: rgba(79,209,197,.06); border-radius: 0; align-items: flex-start; padding-top: 70px; color: rgba(255,255,255,.4); font-weight: 400; }
  .uib.dim { background: rgba(10,10,14,.55); border: 0; cursor: default; }
  .uib.dim.light { background: rgba(10,10,14,.3); }
  .uib.dim.full { background: #000; }
  .uib.dim .tag { display: none; }
  .uib.card { background: #f7efdd; color: #3b2a1a; flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 22px 28px; text-align: left; border-radius: 14px; }
  .uib.card .c-t { font-size: 30px; font-weight: 800; }
  .uib.card .c-e { color: #8a6b4a; font-size: 15px; margin-bottom: 10px; }
  .uib.card .c-f { font-size: 17px; font-weight: 500; line-height: 1.55; flex: 1; }
  .uib.card .c-r { font-size: 16px; color: #a33a22; margin-top: 8px; }
  .uib.card .c-p { height: 6px; background: #e6d8bd; border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .uib.card .c-p i { display: block; height: 100%; width: var(--prog, 0%); background: #c8402f; }
  .uib.card.big { padding: 50px 70px; border-radius: 24px; }
  .uib.card.big .c-t { font-size: 72px; } .uib.card.big .c-e { font-size: 30px; margin-bottom: 26px; }
  .uib.card.big .c-f { font-size: 40px; } .uib.card.big .c-r { font-size: 36px; } .uib.card.big .c-p { height: 12px; }
  .uib.count { font-size: 120px; font-weight: 900; background: none; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.35); border-radius: 50%; }
  .frame.big .uib.count { font-size: 300px; }
  .uib.big-word { font-size: 64px; font-weight: 900; background: rgba(247,239,221,.95); color: #c8402f; letter-spacing: 6px; }
  .frame.big .uib { font-size: 34px; } .frame.big .uib .tag { font-size: 20px; top: -32px; }
  .uib.big-t { font-size: 40px !important; }
  .frame.big .uib.chip { font-size: 24px; }
  .frame.big .lbl { font-size: 18px; } .frame.big .lbl i { font-size: 15px; }
  .uib.q { background: rgba(255,231,160,.95); }
  .uib.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); align-content: start; gap: 6px; padding: 18px; font-size: 22px !important; font-weight: 500; background: rgba(247,239,221,.9); color: #3b2a1a; justify-items: start; }
  .uib.names span { white-space: nowrap; }
  .uib.qr { background: #fff; color: #222; flex-direction: column; font-size: 26px; }
  .uib.qr .qrbox { width: 72%; aspect-ratio: 1; margin-bottom: 14px;
    background: repeating-conic-gradient(#222 0 25%, #fff 0 50%) 0 0 / 28px 28px; }
  .uib.form { background: #f7efdd; color: #3b2a1a; flex-direction: column; gap: 10px; }
  .uib.input { background: #fff; color: #999; justify-content: flex-start; padding-left: 14px; font-weight: 400; }
  .uib.sw { border-radius: 50%; border: 3px solid #fff; }
  .uib.btn { background: #c8402f; color: #fff; border-radius: 26px; font-size: 20px; }
  .uib.paper { background: #efe3c8; border: 0; border-radius: 0; cursor: default; }
  .uib.paper .tag { display: none; }
  .uib.hint { flex-direction: column; background: #efe3c8; color: #3b2a1a; font-size: 22px; gap: 14px; }
  .uib.safe { border: 1px dashed rgba(255,80,80,.7); background: rgba(255,80,80,.07); border-radius: 0; cursor: default; }
  .uib.safe .tag { background: rgba(255,90,90,.85); top: auto; bottom: 4px; left: 4px; }
  .hide-uilbl .uib.safe { display: none; }
  .uib.overlay { border: 3px dashed #ffd166; background: rgba(255,209,102,.08); color: #ffd166; }
  .uib.ending { background: rgba(247,239,221,.95); color: #3b2a1a; flex-direction: column; gap: 6px; }
  .uib.ending b { font-size: 38px; color: #c8402f; }

  /* 视频层 */
  .video { background: #000; }
  .video .vimg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity .4s; }
  .video .vph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px;
    background: repeating-linear-gradient(45deg, #2a2d36 0 40px, #252830 40px 80px); color: #c9cdd6; font-size: 44px; text-align: center; padding: 0 160px; }
  .video .vph small { font-size: 28px; color: #8b93a1; }
  .video .vph.sm { font-size: 20px; padding: 0 70px; gap: 8px; } .video .vph.sm small { font-size: 13px; }
  .uib.crop { border: 4px dashed rgba(255,255,255,.75); background: none; border-radius: 0; }
  .uib.crop .tag { top: 6px; left: 6px; }

  /* 时间轴 */
  .timeline { grid-column: 1 / 2; border-top: 1px solid var(--line); padding: 8px 14px 12px; }
  .tl-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; color: var(--mute); }
  .tl-head .tabs { display: flex; gap: 4px; }
  .tl-bar { position: relative; display: flex; height: 44px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .tl-seg { position: relative; border-right: 1px solid #0f1115; padding: 4px 8px; font-size: 12px; overflow: hidden; cursor: pointer; background: #262b35; min-width: 30px; }
  .tl-seg.on { background: #3a4252; }
  .tl-seg b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-seg span { color: var(--mute); white-space: nowrap; }
  .tl-seg.ov { background: repeating-linear-gradient(45deg, #4a4026 0 8px, #3d3520 8px 16px); }
  .tl-head-play { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hot); pointer-events: none; }

  /* 侧栏 */
  aside { grid-row: 2 / 4; grid-column: 2; border-left: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; min-width: 0; background: var(--panel); }
  aside code { word-break: break-all; }
  aside section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  aside h2 { font-size: 16px; margin: 0 0 2px; }
  aside h3 { font-size: 13px; margin: 0 0 8px; color: #c9cdd6; }
  aside .sub { color: var(--mute); margin-bottom: 8px; }
  aside p { margin: 4px 0; }
  .who { display: grid; grid-template-columns: 44px 1fr; gap: 4px 8px; }
  .own { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; color: #111; background: var(--c); font-weight: 600; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 4px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mute); font-weight: 500; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #262a33; }
  tr.sel { background: #3a3420 !important; }
  td code { font-size: 11px; color: #ffd8a8; word-break: break-all; }
  .p1 { color: var(--mute); }
  .pill { font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid #4a5160; color: #c9cdd6; margin-left: 4px; }
  .pill.hero { border-color: var(--A); color: var(--A); }
  .pill.reuse { border-color: var(--U); color: var(--U); }
  details { margin: 0; }
  summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
  ul.tight { margin: 6px 0; padding-left: 18px; }
  ul.tight li { margin: 3px 0; }
  .concept { width: 100%; border-radius: 6px; display: block; margin-top: 6px; opacity: .9; }
  .selbox { background: #2a2615; border: 1px solid #5a4d22; border-radius: 6px; padding: 8px 10px; display: none; }
  .selbox.show { display: block; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; }
  .kbd { color: var(--mute); font-size: 12px; }
  .err { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #f88; padding: 40px; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title"><b>锦江十二月市 · 白模流程蓝图</b><span>蛋仔派对式简化版 · 折纸风 · Three.js 白模占位 · 点击流程节点 / 物体 / UI 框查看说明</span></div>
    <div class="flow" id="flow"></div>
  </header>

  <div class="stage-wrap">
    <div class="toolbar">
      <div class="grp"><span>设备</span>
        <button data-dev="phone">手机 844×390</button><button data-dev="big">大屏 1920×1080</button><button data-dev="both">并排</button></div>
      <div class="grp"><span>镜头</span>
        <button data-cam="game">游戏镜头</button><button data-cam="top">全景俯视</button><button data-cam="free">自由旋转</button></div>
      <div class="grp"><span>显示</span>
        <button data-tg="lbl3d">3D标注</button><button data-tg="size">尺寸</button><button data-tg="lblui">UI框</button><button data-tg="tint">责任色</button><button data-tg="p0">只看P0</button></div>
      <div class="grp"><span>流程</span>
        <button id="btnPrev">◀</button><button id="btnPlay">▶ 播放</button><button id="btnNext">▶︎▶︎</button>
        <button data-spd="1">1×</button><button data-spd="4">4×</button></div>
    </div>
    <div class="stage" id="stage"></div>
  </div>

  <div class="timeline">
    <div class="tl-head"><span id="tlTitle"></span><div class="tabs" id="phaseTabs"></div><span id="tlTime" style="margin-left:auto"></span></div>
    <div class="tl-bar" id="tlBar"></div>
  </div>

  <aside id="panel"></aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
